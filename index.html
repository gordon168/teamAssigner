<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Basketball Team Assignment</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Basketball Team Assignment</h1>
        <div class="input-container">
            <label for="player-count">Enter number of players:</label>
            <input type="number" id="player-count" min="7" value="10">
            <label for="team-size">Enter team size:</label>
            <input type="number" id="team-size" min="2" value="4">
            <button id="assign-btn">Assign Teams</button>
        </div>
        <div class="player-circle-container">
            <div class="player-circle"></div>
            <div class="basketball"></div>
        </div>
        <div class="teams-container"></div>
    </div>
    <script src="script.js"></script>
</body>
</html>
